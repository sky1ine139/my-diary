<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:393px; height:852px; overflow:hidden; }
  body { background:#FDFBF7; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
         -webkit-font-smoothing:antialiased; position:relative; }
  .statusbar { height:28px; display:flex; align-items:center; justify-content:space-between;
               padding:0 20px; font-size:12px; color:#1F2933; font-weight:600; }
  .header { padding:22px 22px 0 22px; position:relative; }
  .h-title { font-size:26px; font-weight:bold; color:#1F2933; letter-spacing:.02em; }
  .h-sub { font-size:12px; color:#9AA5B1; margin-top:3px; }
  .more { position:absolute; right:12px; top:20px; font-size:18px; color:#52606D; letter-spacing:1px; }
  .divider { height:1px; background:#E4E7EB; margin-top:16px; }
  .search { margin:14px 18px 0 18px; height:44px; border-radius:22px;
            background:#F6F1EA; border:1px solid #EDE4D9; display:flex; align-items:center;
            padding:0 16px; font-size:14px; color:#9AA5B1; }
  .cal-head { display:flex; align-items:center; padding:8px 18px 10px 18px; }
  .arrow { width:44px; height:40px; display:flex; align-items:center; justify-content:center;
           font-size:22px; color:#52606D; }
  .month { flex:1; text-align:center; font-size:16px; font-weight:bold; color:#1F2933; }
  .week { display:flex; padding:0 18px; }
  .week div { flex:1; text-align:center; font-size:12px; color:#9AA5B1; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); padding:0 17px; }
  .week div:first-child { margin-left:1px; }
  .cell { height:44px; display:flex; align-items:center; justify-content:center;
          font-size:14px; color:#52606D; margin:1px; }
  .cell.has { background:#F3EAE2; border:1px solid #E2CDBA; border-radius:50%;
              color:#1F2933; font-weight:bold; }
  .cell.today { background:#8C6A4A; color:#fff; font-weight:bold; border-radius:50%; }
  .bottombar { position:absolute; bottom:0; left:0; right:0; height:62px;
               background:#FDFBF7; border-top:1px solid #E4E7EB;
               display:flex; align-items:center; padding:0 10px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:2px; }
  .tab .ic { font-size:18px; } .tab .lb { font-size:11px; }
  .tab.on .ic, .tab.on .lb { color:#8C6A4A; }
  .tab.off .ic, .tab.off .lb { color:#9AA5B1; }
  .write-btn { width:46px; height:34px; border-radius:17px; background:#8C6A4A;
               color:#fff; font-size:20px; font-weight:bold; display:flex;
               align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="statusbar"><span>22:47</span><span>▲ ▮ 88%</span></div>
  <div class="header">
    <div class="h-title">我的日记</div>
    <div class="h-sub">2026年10月31日 周六</div>
    <div class="more">···</div>
    <div class="divider"></div>
  </div>
  <div class="search">搜索标题、正文或标签</div>

  <div class="cal-head">
    <div class="arrow">‹</div><div class="month">2026年10月</div><div class="arrow">›</div>
  </div>
  <div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>

  <div class="grid">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell has">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div>
    <div class="cell">5</div><div class="cell has">6</div><div class="cell">7</div><div class="cell has">8</div>
    <div class="cell">9</div><div class="cell">10</div><div class="cell">11</div><div class="cell has">12</div>
    <div class="cell">13</div><div class="cell">14</div><div class="cell has">15</div><div class="cell">16</div>
    <div class="cell">17</div><div class="cell">18</div><div class="cell has">19</div><div class="cell has">20</div>
    <div class="cell">21</div><div class="cell">22</div><div class="cell has">23</div><div class="cell">24</div>
    <div class="cell">25</div><div class="cell has">26</div><div class="cell">27</div><div class="cell has">28</div>
    <div class="cell">29</div><div class="cell has">30</div><div class="cell today">31</div>
  </div>

  <div class="bottombar">
    <div class="tab off"><span class="ic">☰</span><span class="lb">日记</span></div>
    <div class="tab on"><span class="ic">▦</span><span class="lb">日历</span></div>
    <div class="tab"><div class="write-btn">+</div></div>
  </div>
</body>
</html>
