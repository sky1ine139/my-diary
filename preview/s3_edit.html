<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:393px; height:852px; overflow:hidden; }
  body { background:#FDFBF7; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
         -webkit-font-smoothing:antialiased; position:relative; }
  .statusbar { height:28px; display:flex; align-items:center; justify-content:space-between;
               padding:0 20px; font-size:12px; color:#1F2933; font-weight:600; }

  .topbar { display:flex; align-items:center; padding:12px 12px 0 8px; }
  .back { width:46px; height:44px; display:flex; align-items:center;
          justify-content:center; font-size:26px; color:#1F2933; }
  .tb-date { flex:1; font-size:16px; font-weight:bold; color:#1F2933; }
  .save { height:36px; padding:0 18px; background:#8C6A4A; color:#fff; border-radius:17px;
          display:flex; align-items:center; font-size:14px; }
  .del { width:46px; height:40px; display:flex; align-items:center;
         justify-content:center; font-size:16px; margin-left:4px; }

  .content { padding:10px 22px 0 22px; }
  .label { font-size:12px; color:#52606D; }
  .chips { display:flex; gap:8px; margin-top:6px; }
  .chip { padding:8px 14px; border-radius:18px; font-size:13px;
          background:#F6F1EA; border:1px solid #EADFD2; color:#52606D; }
  .chip.sel { background:#8C6A4A; border-color:#8C6A4A; color:#fff; }

  .etitle { margin-top:20px; font-size:22px; font-weight:bold; color:#1F2933; }
  .etitle.placeholder { color:#9AA5B1; font-weight:bold; }
  .hr { height:1px; background:#E4E7EB; margin-top:12px; }
  .ebody { margin-top:14px; font-size:16px; color:#1F2933; line-height:1.85; }
  .ebody .ph { color:#9AA5B1; }
  .etags { margin-top:16px; height:44px; border-radius:22px; background:#F6F1EA;
           border:1px solid #EDE4D9; display:flex; align-items:center;
           padding:0 14px; font-size:13px; color:#1F2933; }
</style>
</head>
<body>
  <div class="statusbar"><span>22:47</span><span>▲ ▮ 88%</span></div>

  <div class="topbar">
    <div class="back">‹</div>
    <div class="tb-date">今天 · 10月31日 周六</div>
    <div class="save">保存</div>
    <div class="del">🗑</div>
  </div>

  <div class="content">
    <div class="label" style="margin-top:10px">心情</div>
    <div class="chips">
      <div class="chip sel">😄 开心</div>
      <div class="chip">🙂 平静</div>
      <div class="chip">😪 疲惫</div>
      <div class="chip">😔 难过</div>
    </div>

    <div class="label" style="margin-top:16px">天气</div>
    <div class="chips">
      <div class="chip">☀️ 晴</div>
      <div class="chip sel">⛅ 云</div>
      <div class="chip">🌧️ 雨</div>
    </div>

    <div class="etitle">雨停了，巷子里的桂花香</div>
    <div class="hr"></div>

    <div class="ebody">
      下午加班到七点，出来发现雨已经停了，空气里全是桂花味。<br>
      走了两站路回家，路过那家旧书店还亮着灯，老板在门口抽烟，<br>
      跟我点了点头。
    </div>

    <div class="etags">生活, 散步</div>
  </div>
</body>
</html>
